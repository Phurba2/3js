<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Three.js - Chapter 2</title>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
            }
        }
    </script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #101018;
            font-family: Arial, sans-serif;
            color: white;
        }

        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            line-height: 1.7;
            pointer-events: none;
        }

        #controls {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        button {
            padding: 10px 14px;
            background: #252540;
            color: white;
            border: 1px solid #7777aa;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #41416b;
        }
    </style>
</head>

<body>

    <div id="info">
        <strong>THREE.JS — CHAPTER 2</strong><br>
        Geometries, Meshes and Cameras<br>
        <span id="cameraLabel">Camera: Perspective</span>
    </div>

    <div id="controls">
        <button id="cameraButton">Switch Camera</button>
        <button id="addButton">Add Cube</button>
        <button id="removeButton">Remove Cube</button>
    </div>

    <script type="module">

        import * as THREE from "three";


        // ==========================================
        // 1. CREATE THE SCENE
        // ==========================================

        const scene = new THREE.Scene();

        scene.background = new THREE.Color(0x101018);


        // ==========================================
        // 2. CREATE THE PERSPECTIVE CAMERA
        // ==========================================

        const perspectiveCamera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            100
        );

        perspectiveCamera.position.set(6, 5, 9);

        perspectiveCamera.lookAt(0, 1, 0);


        // ==========================================
        // 3. CREATE THE ORTHOGRAPHIC CAMERA
        // ==========================================

        const viewSize = 12;

        const aspect = window.innerWidth / window.innerHeight;

        const orthographicCamera = new THREE.OrthographicCamera(
            -viewSize * aspect / 2,
             viewSize * aspect / 2,
             viewSize / 2,
            -viewSize / 2,
            0.1,
            100
        );

        orthographicCamera.position.set(6, 5, 9);

        orthographicCamera.lookAt(0, 1, 0);


        // Select the camera currently in use.

        let activeCamera = perspectiveCamera;

        let usingPerspective = true;


        // ==========================================
        // 4. CREATE THE RENDERER
        // ==========================================

        const renderer = new THREE.WebGLRenderer({
            antialias: true
        });

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 2)
        );

        document.body.appendChild(renderer.domElement);


        // ==========================================
        // 5. ADD LIGHTS
        // ==========================================

        const ambientLight = new THREE.AmbientLight(
            0xffffff,
            1.5
        );

        scene.add(ambientLight);


        const directionalLight = new THREE.DirectionalLight(
            0xffffff,
            2
        );

        directionalLight.position.set(5, 8, 5);

        scene.add(directionalLight);


        // ==========================================
        // 6. CREATE A CUBE
        // ==========================================

        const cubeGeometry = new THREE.BoxGeometry(
            1.5, 1.5, 1.5
        );

        const cubeMaterial = new THREE.MeshStandardMaterial({
            color: 0x00aaff,
            roughness: 0.4
        });

        const cube = new THREE.Mesh(
            cubeGeometry,
            cubeMaterial
        );

        cube.position.set(-2, 1, 0);

        scene.add(cube);


        // ==========================================
        // 7. CREATE A SPHERE
        // ==========================================

        const sphereGeometry = new THREE.SphereGeometry(
            0.9, 32, 32
        );

        const sphereMaterial = new THREE.MeshStandardMaterial({
            color: 0xff5533,
            roughness: 0.4
        });

        const sphere = new THREE.Mesh(
            sphereGeometry,
            sphereMaterial
        );

        sphere.position.set(0, 1, 0);

        scene.add(sphere);


        // ==========================================
        // 8. CREATE A CONE
        // ==========================================

        const coneGeometry = new THREE.ConeGeometry(
            0.8, 1.8, 32
        );

        const coneMaterial = new THREE.MeshStandardMaterial({
            color: 0x44dd88
        });

        const cone = new THREE.Mesh(
            coneGeometry,
            coneMaterial
        );

        cone.position.set(2, 1, 0);

        scene.add(cone);


        // ==========================================
        // 9. CREATE A TORUS
        // ==========================================

        const torusGeometry = new THREE.TorusGeometry(
            0.7, 0.25, 16, 48
        );

        const torusMaterial = new THREE.MeshStandardMaterial({
            color: 0xffcc33,
            metalness: 0.3,
            roughness: 0.3
        });

        const torus = new THREE.Mesh(
            torusGeometry,
            torusMaterial
        );

        torus.position.set(4, 1, 0);

        scene.add(torus);


        // ==========================================
        // 10. CREATE THE FLOOR
        // ==========================================

        const floorGeometry = new THREE.PlaneGeometry(
            200, 200
        );

        const floorMaterial = new THREE.MeshStandardMaterial({
            color: 0x252535,
            roughness: 0.9
        });

        const floor = new THREE.Mesh(
            floorGeometry,
            floorMaterial
        );

        floor.rotation.x = -Math.PI / 2;

        floor.position.y = 0;

        scene.add(floor);


        // Add a grid to help visualize 3D space.

        const grid = new THREE.GridHelper(
            20, 20, 0x666688, 0x333344
        );

        grid.position.y = 0.01;

        scene.add(grid);


        // ==========================================
        // 11. ADD AND REMOVE CUBES
        // ==========================================

        const extraCubes = [];

        function addCube() {

            const geometry = new THREE.BoxGeometry(
                1, 1, 1
            );

            const material = new THREE.MeshStandardMaterial({
                color: Math.random() * 0xffffff
            });

            const newCube = new THREE.Mesh(
                geometry,
                material
            );

            newCube.position.set(
                Math.random() * 6 - 3,
                Math.random() * 3 + 0.5,
                Math.random() * 4 - 2
            );

            scene.add(newCube);

            extraCubes.push(newCube);
        }


        function removeCube() {

            if (extraCubes.length === 0) {
                return;
            }

            const lastCube = extraCubes.pop();

            scene.remove(lastCube);

            lastCube.geometry.dispose();

            lastCube.material.dispose();
        }


        document.getElementById("addButton").addEventListener(
            "click",
            addCube
        );

        document.getElementById("removeButton").addEventListener(
            "click",
            removeCube
        );


        // ==========================================
        // 12. SWITCH BETWEEN CAMERAS
        // ==========================================

        document.getElementById("cameraButton").addEventListener(
            "click",
            () => {

                usingPerspective = !usingPerspective;

                if (usingPerspective) {

                    activeCamera = perspectiveCamera;

                    document.getElementById("cameraLabel").textContent =
                        "Camera: Perspective";

                } else {

                    activeCamera = orthographicCamera;

                    document.getElementById("cameraLabel").textContent =
                        "Camera: Orthographic";

                }

            }
        );


        // ==========================================
        // 13. ANIMATION LOOP
        // ==========================================

        function animate() {

            requestAnimationFrame(animate);

            cube.rotation.x += 0.01;

            cube.rotation.y += 0.01;

            sphere.rotation.y += 0.015;

            cone.rotation.y += 0.01;

            torus.rotation.x += 0.01;

            torus.rotation.y += 0.01;

            renderer.render(scene, activeCamera);

        }

        animate();


        // ==========================================
        // 14. HANDLE WINDOW RESIZING
        // ==========================================

        window.addEventListener("resize", () => {

            const width = window.innerWidth;

            const height = window.innerHeight;

            const aspect = width / height;


            // Update the perspective camera.

            perspectiveCamera.aspect = aspect;

            perspectiveCamera.updateProjectionMatrix();


            // Update the orthographic camera.

            orthographicCamera.left = -viewSize * aspect / 2;

            orthographicCamera.right = viewSize * aspect / 2;

            orthographicCamera.top = viewSize / 2;

            orthographicCamera.bottom = -viewSize / 2;

            orthographicCamera.updateProjectionMatrix();


            // Resize the renderer.

            renderer.setSize(width, height);

        });

    </script>

</body>

</html>
