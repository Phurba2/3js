<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter 11 - ShaderPass Effects Lab</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #10131c;
      color: white;
      font-family: Arial, sans-serif;
    }

    #panel {
      position: absolute;
      top: 15px;
      left: 15px;
      width: 270px;
      padding: 16px;
      background: rgba(15, 20, 32, 0.94);
      border: 1px solid #414b60;
      border-radius: 12px;
      z-index: 10;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    p {
      color: #b9c4d8;
      font-size: 13px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 9px;
      margin: 4px 0;
      color: white;
      background: #28344b;
      border: 1px solid #50617c;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #3c5274;
    }

    button.active {
      background: #167dba;
      border-color: #59c5ff;
    }

    label {
      display: block;
      margin-top: 14px;
      font-size: 13px;
    }

    input[type="range"] {
      width: 100%;
      margin-top: 8px;
    }

    .value {
      color: #65d5ff;
      float: right;
    }

    #status {
      margin-top: 12px;
      padding: 8px;
      background: #202b3d;
      border-radius: 6px;
      font-size: 12px;
    }

    #help {
      position: absolute;
      bottom: 12px;
      left: 12px;
      padding: 8px 12px;
      background: rgba(15, 20, 32, 0.8);
      color: #c7d3e7;
      font-size: 12px;
      border-radius: 6px;
    }
  </style>
</head>

<body>

  <div id="panel">
    <h2>ShaderPass Lab</h2>

    <p>
      Apply image-processing effects to the entire 3D scene.
      Select an effect and adjust its settings.
    </p>

    <button class="active" data-effect="normal">Normal Image</button>
    <button data-effect="gray">Grayscale</button>
    <button data-effect="sepia">Sepia Photograph</button>
    <button data-effect="brightness">Brightness & Contrast</button>

    <label>
      Brightness
      <span class="value" id="brightnessValue">0.00</span>
    </label>
    <input
      id="brightness"
      type="range"
      min="-0.8"
      max="0.8"
      step="0.05"
      value="0"
    >

    <label>
      Contrast
      <span class="value" id="contrastValue">0.00</span>
    </label>
    <input
      id="contrast"
      type="range"
      min="-0.8"
      max="0.8"
      step="0.05"
      value="0"
    >

    <label>
      Sepia Amount
      <span class="value" id="sepiaValue">1.00</span>
    </label>
    <input
      id="sepiaAmount"
      type="range"
      min="0"
      max="1"
      step="0.05"
      value="1"
    >

    <div id="status">Current effect: Normal Image</div>
  </div>

  <div id="help">
    Drag to orbit • Scroll to zoom • Effects are applied after rendering
  </div>

  <script type="module">
    import * as THREE from "three";

    import { OrbitControls } from
      "three/addons/controls/OrbitControls.js";

    import { EffectComposer } from
      "three/addons/postprocessing/EffectComposer.js";

    import { RenderPass } from
      "three/addons/postprocessing/RenderPass.js";

    import { ShaderPass } from
      "three/addons/postprocessing/ShaderPass.js";

    import { LuminosityShader } from
      "three/addons/shaders/LuminosityShader.js";

    import { SepiaShader } from
      "three/addons/shaders/SepiaShader.js";

    import { BrightnessContrastShader } from
      "three/addons/shaders/BrightnessContrastShader.js";


    // --------------------------------------------------
    // 1. BASIC THREE.JS SETUP
    // --------------------------------------------------

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x10131c);

    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    camera.position.set(7, 6, 10);

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    document.body.appendChild(renderer.domElement);


    // --------------------------------------------------
    // 2. CAMERA CONTROLS
    // --------------------------------------------------

    const controls = new OrbitControls(
      camera,
      renderer.domElement
    );

    controls.enableDamping = true;


    // --------------------------------------------------
    // 3. LIGHTING
    // --------------------------------------------------

    const ambientLight = new THREE.AmbientLight(
      0xffffff,
      2
    );

    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(
      0xffffff,
      3
    );

    directionalLight.position.set(5, 8, 5);

    scene.add(directionalLight);


    // --------------------------------------------------
    // 4. CREATE OBJECTS
    // --------------------------------------------------

    const objects = [];

    function addObject(geometry, color, x, y, z) {
      const material = new THREE.MeshStandardMaterial({
        color: color,
        roughness: 0.35,
        metalness: 0.15
      });

      const mesh = new THREE.Mesh(
        geometry,
        material
      );

      mesh.position.set(x, y, z);

      scene.add(mesh);

      objects.push(mesh);

      return mesh;
    }

    // Colorful spheres
    addObject(
      new THREE.SphereGeometry(0.8, 48, 32),
      0xff3355,
      -3, 1, 0
    );

    addObject(
      new THREE.SphereGeometry(0.8, 48, 32),
      0x22ccff,
      0, 1, 0
    );

    addObject(
      new THREE.SphereGeometry(0.8, 48, 32),
      0xffcc22,
      3, 1, 0
    );

    // Green torus
    addObject(
      new THREE.TorusGeometry(0.7, 0.25, 16, 64),
      0x44ee88,
      -3, 1, -3
    );

    // Purple torus knot
    addObject(
      new THREE.TorusKnotGeometry(
        0.65, 0.2, 100, 16
      ),
      0xbb66ff,
      0, 1, -3
    );

    // Orange box
    addObject(
      new THREE.BoxGeometry(1.3, 1.3, 1.3),
      0xff7733,
      3, 1, -3
    );

    // Ground
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      new THREE.MeshStandardMaterial({
        color: 0x394356,
        roughness: 0.8
      })
    );

    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0;

    scene.add(floor);

    // Grid for orientation
    const grid = new THREE.GridHelper(
      20, 20, 0x8190aa, 0x3d4a60
    );

    grid.position.y = 0.015;

    scene.add(grid);


    // --------------------------------------------------
    // 5. CREATE THE POSTPROCESSING COMPOSER
    // --------------------------------------------------

    const composer = new EffectComposer(renderer);

    // First render the actual 3D scene.
    const renderPass = new RenderPass(
      scene,
      camera
    );

    composer.addPass(renderPass);


    // --------------------------------------------------
    // 6. CREATE THREE SHADER PASSES
    // --------------------------------------------------

    const grayscalePass = new ShaderPass(
      LuminosityShader
    );

    const sepiaPass = new ShaderPass(
      SepiaShader
    );

    const brightnessContrastPass = new ShaderPass(
      BrightnessContrastShader
    );

    // Start with every effect disabled.
    grayscalePass.enabled = false;
    sepiaPass.enabled = false;
    brightnessContrastPass.enabled = false;

    // Add the effects to the composer.
    composer.addPass(grayscalePass);
    composer.addPass(sepiaPass);
    composer.addPass(brightnessContrastPass);


    // --------------------------------------------------
    // 7. GET THE HTML CONTROLS
    // --------------------------------------------------

    const buttons = document.querySelectorAll(
      "button[data-effect]"
    );

    const brightnessSlider =
      document.getElementById("brightness");

    const contrastSlider =
      document.getElementById("contrast");

    const sepiaSlider =
      document.getElementById("sepiaAmount");

    const brightnessValue =
      document.getElementById("brightnessValue");

    const contrastValue =
      document.getElementById("contrastValue");

    const sepiaValue =
      document.getElementById("sepiaValue");

    const status =
      document.getElementById("status");


    // --------------------------------------------------
    // 8. SELECT THE ACTIVE EFFECT
    // --------------------------------------------------

    let currentEffect = "normal";

    function selectEffect(effect) {
      currentEffect = effect;

      // Turn off all image effects first.
      grayscalePass.enabled = false;
      sepiaPass.enabled = false;
      brightnessContrastPass.enabled = false;

      // Enable only the selected effect.
      if (effect === "gray") {
        grayscalePass.enabled = true;
      }

      if (effect === "sepia") {
        sepiaPass.enabled = true;
      }

      if (effect === "brightness") {
        brightnessContrastPass.enabled = true;
      }

      // Highlight the selected button.
      buttons.forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.effect === effect
        );
      });

      const names = {
        normal: "Normal Image",
        gray: "Grayscale",
        sepia: "Sepia Photograph",
        brightness: "Brightness & Contrast"
      };

      status.textContent =
        "Current effect: " + names[effect];
    }

    buttons.forEach(button => {
      button.addEventListener("click", () => {
        selectEffect(button.dataset.effect);
      });
    });


    // --------------------------------------------------
    // 9. ADJUST BRIGHTNESS AND CONTRAST
    // --------------------------------------------------

    function updateBrightnessContrast() {
      const brightness = Number(
        brightnessSlider.value
      );

      const contrast = Number(
        contrastSlider.value
      );

      brightnessContrastPass.uniforms[
        "brightness"
      ].value = brightness;

      brightnessContrastPass.uniforms[
        "contrast"
      ].value = contrast;

      brightnessValue.textContent =
        brightness.toFixed(2);

      contrastValue.textContent =
        contrast.toFixed(2);
    }

    brightnessSlider.addEventListener(
      "input",
      updateBrightnessContrast
    );

    contrastSlider.addEventListener(
      "input",
      updateBrightnessContrast
    );


    // --------------------------------------------------
    // 10. ADJUST SEPIA STRENGTH
    // --------------------------------------------------

    function updateSepia() {
      const amount = Number(
        sepiaSlider.value
      );

      sepiaPass.uniforms["amount"].value =
        amount;

      sepiaValue.textContent =
        amount.toFixed(2);
    }

    sepiaSlider.addEventListener(
      "input",
      updateSepia
    );


    // Initialize the shader settings.
    updateBrightnessContrast();
    updateSepia();


    // --------------------------------------------------
    // 11. ANIMATION LOOP
    // --------------------------------------------------

    function animate() {
      requestAnimationFrame(animate);

      controls.update();

      // Slowly rotate all objects.
      objects.forEach((object, index) => {
        object.rotation.y +=
          0.004 + index * 0.0005;
      });

      // Render through the postprocessing pipeline.
      // Do not call renderer.render() here.
      composer.render();
    }

    animate();


    // --------------------------------------------------
    // 12. HANDLE WINDOW RESIZING
    // --------------------------------------------------

    window.addEventListener("resize", () => {
      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      composer.setSize(
        window.innerWidth,
        window.innerHeight
      );
    });

  </script>

</body>
</html>
