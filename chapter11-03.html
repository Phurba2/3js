<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter 11 - Mask Postprocessing Lab (Fixed)</title>
  <style>
    body { margin: 0; overflow: hidden; background: #10131c; color: white; font-family: Arial, sans-serif; }
    #panel { position: absolute; top: 12px; left: 12px; z-index: 10; max-width: 330px; padding: 14px; background: rgba(0,0,0,0.78); border-radius: 8px; }
    button { margin: 4px 3px 4px 0; padding: 8px 10px; cursor: pointer; }
    p { font-size: 13px; line-height: 1.5; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="panel">
    <h2>Mask Postprocessing Lab</h2>
    <p>The blue color effect is applied inside the circular mask.</p>
    <button id="toggleEffect">Toggle Blue Effect</button>
    <button id="toggleMask">Toggle Mask</button>
    <button id="toggleRotation">Pause Rotation</button>
    <p id="status">Blue effect: ON | Mask: ON</p>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { MaskPass, ClearMaskPass } from 'three/addons/postprocessing/MaskPass.js';
    import { TexturePass } from 'three/addons/postprocessing/TexturePass.js';
    import { ColorifyShader } from 'three/addons/shaders/ColorifyShader.js';

    // 1. Renderer (must enable stencil)
    const renderer = new THREE.WebGLRenderer({ antialias: true, stencil: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // 2. Main scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x171d2d);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1, 9);
    camera.lookAt(0, 0, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 1.5));
    const light = new THREE.DirectionalLight(0xffffff, 3);
    light.position.set(4, 6, 5);
    scene.add(light);

    const objects = [];
    const materials = [
      new THREE.MeshStandardMaterial({ color: 0xff7043, roughness: 0.35 }),
      new THREE.MeshStandardMaterial({ color: 0x42d9ff, roughness: 0.3, metalness: 0.2 }),
      new THREE.MeshStandardMaterial({ color: 0xffd54f, roughness: 0.4 }),
      new THREE.MeshStandardMaterial({ color: 0x9b7bff, roughness: 0.35 })
    ];
    const geometries = [
      new THREE.BoxGeometry(1.3, 1.3, 1.3),
      new THREE.SphereGeometry(0.75, 32, 24),
      new THREE.TorusKnotGeometry(0.48, 0.17, 100, 12),
      new THREE.ConeGeometry(0.75, 1.5, 32)
    ];
    const positions = [[-1.9, 0.8, 0], [1.6, 0.8, 0], [-1.5, -1.1, 0], [1.6, -1.1, 0]];

    for (let i = 0; i < geometries.length; i++) {
      const mesh = new THREE.Mesh(geometries[i], materials[i]);
      mesh.position.set(...positions[i]);
      scene.add(mesh);
      objects.push(mesh);
    }

    // 3. Mask scene
    const maskScene = new THREE.Scene();
    const maskMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
    const maskCircle = new THREE.Mesh(new THREE.CircleGeometry(2.0, 64), maskMaterial);
    maskCircle.position.set(0, 0, 4);
    maskScene.add(maskCircle);

    // 4. KEY FIX: manually render main scene into a texture, bypassing RenderPass
    const sceneTarget = new THREE.WebGLRenderTarget(
      window.innerWidth,
      window.innerHeight,
      { stencilBuffer: false }
    );

    function renderSceneToTexture() {
      renderer.setRenderTarget(sceneTarget);
      renderer.clear();
      renderer.render(scene, camera);
      renderer.setRenderTarget(null);
    }
    renderSceneToTexture();

    // 5. Composer (stencil buffer enabled)
    const composerTarget = new THREE.WebGLRenderTarget(
      window.innerWidth, window.innerHeight, { stencilBuffer: true }
    );
    const composer = new EffectComposer(renderer, composerTarget);

    // Pass 1: display the pre-rendered scene
    const texturePass = new TexturePass(sceneTarget.texture);
    composer.addPass(texturePass);

    // Pass 2: write mask to stencil
    const maskPass = new MaskPass(maskScene, camera);
    composer.addPass(maskPass);

    // Pass 3: blue tint (only affects stencil-marked areas)
    const bluePass = new ShaderPass(ColorifyShader);
    bluePass.uniforms['color'].value.setRGB(0.35, 0.55, 1.0);
    composer.addPass(bluePass);

    // Pass 4: clear stencil
    const clearMaskPass = new ClearMaskPass();
    composer.addPass(clearMaskPass);

    // 6. Controls
    let effectEnabled = true, maskEnabled = true, rotationEnabled = true;
    const status = document.getElementById('status');

    function syncPasses() {
      const active = effectEnabled && maskEnabled;
      maskPass.enabled = active;
      bluePass.enabled = active;
      clearMaskPass.enabled = active;
      // TexturePass always stays on; when mask is off, just show the original scene
    }

    document.getElementById('toggleEffect').addEventListener('click', () => {
      effectEnabled = !effectEnabled;
      syncPasses();
      status.textContent = `Blue effect: ${effectEnabled ? 'ON' : 'OFF'} | Mask: ${maskEnabled ? 'ON' : 'OFF'}`;
    });

    document.getElementById('toggleMask').addEventListener('click', () => {
      maskEnabled = !maskEnabled;
      syncPasses();
      status.textContent = `Blue effect: ${effectEnabled ? 'ON' : 'OFF'} | Mask: ${maskEnabled ? 'ON' : 'OFF'}`;
    });

    document.getElementById('toggleRotation').addEventListener('click', (e) => {
      rotationEnabled = !rotationEnabled;
      e.target.textContent = rotationEnabled ? 'Pause Rotation' : 'Resume Rotation';
    });

    // 7. Animation
    function animate() {
      requestAnimationFrame(animate);

      if (rotationEnabled) {
        objects.forEach((obj, i) => {
          obj.rotation.x += 0.005 + i * 0.001;
          obj.rotation.y += 0.009 + i * 0.002;
        });
      }

      // Update the scene texture every frame
      renderSceneToTexture();
      composer.render();
    }
    animate();

    // 8. Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      sceneTarget.setSize(window.innerWidth, window.innerHeight);
    });

    syncPasses();
  </script>
</body>
</html>
