<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter 11 - Custom Shader Lab</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #10131c;
      color: white;
      font-family: Arial, sans-serif;
    }

    #panel {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      width: 270px;
      padding: 16px;
      background: rgba(15, 20, 32, 0.94);
      border: 1px solid #414b60;
      border-radius: 12px;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    p {
      color: #bbc6da;
      font-size: 13px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      color: white;
      background: #28344b;
      border: 1px solid #50617c;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #3c5274;
    }

    label {
      display: block;
      margin-top: 18px;
      font-size: 13px;
    }

    input {
      width: 100%;
      margin-top: 10px;
    }

    .value {
      float: right;
      color: #65d5ff;
    }

    #status {
      margin-top: 14px;
      padding: 9px;
      background: #202b3d;
      border-radius: 6px;
      font-size: 12px;
    }

    #help {
      position: absolute;
      bottom: 12px;
      left: 12px;
      padding: 9px 12px;
      background: rgba(15, 20, 32, 0.85);
      color: #c7d3e7;
      font-size: 12px;
      border-radius: 6px;
    }
  </style>
</head>

<body>

  <div id="panel">
    <h2>Custom Shader Lab</h2>

    <p>
      This effect is written with GLSL instead of using
      a predefined Three.js image filter.
    </p>

    <button id="toggleButton">Turn Effect Off</button>

    <label>
      Effect Strength
      <span class="value" id="strengthValue">1.00</span>
    </label>

    <input
      id="strength"
      type="range"
      min="0"
      max="1"
      step="0.05"
      value="1"
    >

    <div id="status">Custom shader: ON</div>
  </div>

  <div id="help">
    Drag to orbit • Scroll to zoom • Watch the animated scanlines
  </div>

  <script type="module">
    import * as THREE from "three";

    import { OrbitControls } from
      "three/addons/controls/OrbitControls.js";

    import { EffectComposer } from
      "three/addons/postprocessing/EffectComposer.js";

    import { RenderPass } from
      "three/addons/postprocessing/RenderPass.js";

    import { ShaderPass } from
      "three/addons/postprocessing/ShaderPass.js";


    // --------------------------------------------------
    // 1. SCENE, CAMERA AND RENDERER
    // --------------------------------------------------

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x172033);

    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    camera.position.set(7, 6, 10);

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    document.body.appendChild(renderer.domElement);


    // --------------------------------------------------
    // 2. CAMERA CONTROLS
    // --------------------------------------------------

    const controls = new OrbitControls(
      camera,
      renderer.domElement
    );

    controls.enableDamping = true;


    // --------------------------------------------------
    // 3. LIGHTING
    // --------------------------------------------------

    scene.add(
      new THREE.AmbientLight(0xffffff, 1.5)
    );

    const light = new THREE.DirectionalLight(
      0xffffff,
      3
    );

    light.position.set(5, 8, 5);

    scene.add(light);


    // --------------------------------------------------
    // 4. CREATE THE 3D OBJECTS
    // --------------------------------------------------

    const objects = [];

    function addObject(geometry, color, x, y, z) {
      const material = new THREE.MeshStandardMaterial({
        color,
        roughness: 0.3,
        metalness: 0.2
      });

      const mesh = new THREE.Mesh(
        geometry,
        material
      );

      mesh.position.set(x, y, z);

      scene.add(mesh);

      objects.push(mesh);

      return mesh;
    }

    addObject(
      new THREE.SphereGeometry(0.8, 48, 32),
      0xff3355,
      -3, 1, 0
    );

    addObject(
      new THREE.SphereGeometry(0.8, 48, 32),
      0x22ccff,
      0, 1, 0
    );

    addObject(
      new THREE.SphereGeometry(0.8, 48, 32),
      0xffcc22,
      3, 1, 0
    );

    addObject(
      new THREE.TorusGeometry(0.7, 0.25, 16, 64),
      0x44ee88,
      -3, 1, -3
    );

    addObject(
      new THREE.TorusKnotGeometry(
        0.65, 0.2, 100, 16
      ),
      0xbb66ff,
      0, 1, -3
    );

    addObject(
      new THREE.BoxGeometry(1.3, 1.3, 1.3),
      0xff7733,
      3, 1, -3
    );

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      new THREE.MeshStandardMaterial({
        color: 0x394356,
        roughness: 0.8
      })
    );

    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0;

    scene.add(floor);

    const grid = new THREE.GridHelper(
      20, 20, 0x8190aa, 0x3d4a60
    );

    grid.position.y = 0.015;

    scene.add(grid);


    // --------------------------------------------------
    // 5. DEFINE OUR OWN SHADER
    // --------------------------------------------------

    const CustomShader = {

      uniforms: {
        tDiffuse: { value: null },
        time: { value: 0 },
        strength: { value: 1 }
      },

      vertexShader: `
        varying vec2 vUv;

        void main() {
          vUv = uv;

          gl_Position =
            projectionMatrix *
            modelViewMatrix *
            vec4(position, 1.0);
        }
      `,

      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float time;
        uniform float strength;

        varying vec2 vUv;

        void main() {

          // 1. Read the original rendered pixel.
          vec4 originalColor =
            texture2D(tDiffuse, vUv);

          // 2. Create a subtle blue/purple color tint.
          vec3 tintedColor = vec3(
            originalColor.r * 1.08,
            originalColor.g * 0.96,
            originalColor.b * 1.15
          );

          // 3. Create moving horizontal scanlines.
          float scanline =
            0.94 +
            0.06 * sin(vUv.y * 900.0 + time * 3.0);

          // 4. Darken the corners of the image.
          float distanceFromCenter =
            distance(vUv, vec2(0.5, 0.5));

          float vignette =
            1.0 - smoothstep(
              0.25,
              0.75,
              distanceFromCenter
            );

          // 5. Combine the effects.
          vec3 effectedColor =
            tintedColor * scanline * vignette;

          // 6. Blend between the original and
          //    effected image using strength.
          vec3 finalColor = mix(
            originalColor.rgb,
            effectedColor,
            strength
          );

          gl_FragColor = vec4(
            finalColor,
            originalColor.a
          );
        }
      `
    };


    // --------------------------------------------------
    // 6. CREATE THE POSTPROCESSING PIPELINE
    // --------------------------------------------------

    const composer = new EffectComposer(renderer);

    const renderPass = new RenderPass(
      scene,
      camera
    );

    composer.addPass(renderPass);

    const customPass = new ShaderPass(CustomShader);

    composer.addPass(customPass);


    // --------------------------------------------------
    // 7. CONNECT THE HTML CONTROLS
    // --------------------------------------------------

    const toggleButton =
      document.getElementById("toggleButton");

    const strengthSlider =
      document.getElementById("strength");

    const strengthValue =
      document.getElementById("strengthValue");

    const status =
      document.getElementById("status");

    let effectEnabled = true;


    toggleButton.addEventListener("click", () => {

      effectEnabled = !effectEnabled;

      customPass.enabled = effectEnabled;

      toggleButton.textContent = effectEnabled
        ? "Turn Effect Off"
        : "Turn Effect On";

      status.textContent = effectEnabled
        ? "Custom shader: ON"
        : "Custom shader: OFF";
    });


    strengthSlider.addEventListener("input", () => {

      const strength = Number(
        strengthSlider.value
      );

      customPass.uniforms["strength"].value =
        strength;

      strengthValue.textContent =
        strength.toFixed(2);
    });


    // --------------------------------------------------
    // 8. ANIMATION LOOP
    // --------------------------------------------------

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      controls.update();

      const elapsedTime = clock.getElapsedTime();

      // Send the current time to our shader.
      customPass.uniforms["time"].value =
        elapsedTime;

      // Rotate the objects.
      objects.forEach((object, index) => {
        object.rotation.y +=
          0.004 + index * 0.0005;
      });

      // Render the scene and postprocessing effects.
      composer.render();
    }

    animate();


    // --------------------------------------------------
    // 9. HANDLE WINDOW RESIZING
    // --------------------------------------------------

    window.addEventListener("resize", () => {

      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      composer.setSize(
        window.innerWidth,
        window.innerHeight
      );
    });

  </script>

</body>
</html>
